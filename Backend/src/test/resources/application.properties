# Test Configuration using in-memory H2 database with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Domain gating test config
app.auth.allowed-email-domains=anits.edu.in,example.com,example.test

# Test JWT Secret (HMAC-SHA256, 512-bit safe key)
jwt.secret.key=dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3JzbWFydGdpZXZhbmNlc3lzdGVtdGVzdGluZ3B1cnBvc2Vzb25seTEyMzQ1Ng==
jwt.expiration.time=86400000
jwt.refresh.expiration.time=604800000

# Email Mock in Tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test

# File uploads in target folder
app.upload.dir=target/test-uploads
app.allowed.file.extensions=pdf,doc,docx,jpg,jpeg,png,txt
app.upload.max-size-bytes=5242880
